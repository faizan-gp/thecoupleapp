<!--
  Manifest icon (app/manifest.ts). Same art as app/icon.svg, kept in sync by
  hand: this one is fetched by the browser as a PWA asset from /icon.svg,
  while app/icon.svg is the tab favicon Next wires up from the app directory.
-->
