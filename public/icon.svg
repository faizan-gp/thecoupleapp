  <rect width="64" height="64" rx="14" fill="#171111"/>
  <circle cx="32" cy="20.5" r="17.5" fill="none" stroke="#f0609f" stroke-width="5.2"/>
  <circle cx="32" cy="43.5" r="17.5" fill="none" stroke="#f97a2f" stroke-width="5.2"/>
</svg>
